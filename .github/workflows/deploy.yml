
name: Deploy Bank Mini via FTP

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-bank-mini
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode dari GitHub
        uses: actions/checkout@v4

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql, pdo_sqlite, gd, zip
          tools: composer

      - name: Validasi Composer
        run: composer validate --no-check-publish

      - name: Siapkan dependency aplikasi
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build aset frontend
        run: |
          npm ci --include=optional --no-audit --no-fund
          npm run build

      - name: Jalankan pengujian
        run: php artisan test --filter=LoginRedirectTest

      - name: Siapkan dependency production
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          composer check-platform-reqs --no-dev
          php artisan route:list --path=login
          php artisan view:cache

      # Upload source, vendor production, dan manifest provider yang baru dibangun.
      - name: Upload aplikasi Laravel
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          timeout: 120000
          local-dir: ./
          server-dir: laravel_app/
          state-name: .ftp-app-state.json
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.*
            **/public/**
            **/storage/**
            **/database/*.sqlite
            **/phpunit.xml
            **/package-lock.json

      # Upload file publik
      - name: Upload file publik
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          timeout: 120000
          local-dir: ./public/
          server-dir: public_html/
          state-name: .ftp-public-state.json
          dry-run: false
