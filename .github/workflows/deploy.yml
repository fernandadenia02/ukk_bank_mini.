name: Build Bank Mini deployment ZIPs

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-bank-mini
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode dari GitHub
        uses: actions/checkout@v4

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql, pdo_sqlite, gd, zip
          tools: composer

      - name: Validasi Composer
        run: composer validate --no-check-publish

      - name: Siapkan dependency untuk test
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependency frontend
        run: npm ci

      - name: Build aset frontend
        run: npm run build

      - name: Jalankan seluruh test Laravel
        run: php artisan test

      - name: Siapkan dependency production
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          composer check-platform-reqs --no-dev
          php artisan route:list --path=login
          php artisan view:cache

      - name: Buat ZIP deployment
        run: python3 .github/scripts/package-deployment.py "$RUNNER_TEMP/deployment"

      - name: Upload artifact deployment
        uses: actions/upload-artifact@v4.6.2
        with:
          name: bank-mini-deployment
          path: |
            ${{ runner.temp }}/deployment/laravel_app.zip
            ${{ runner.temp }}/deployment/public_html.zip
          if-no-files-found: error
          retention-days: 7
